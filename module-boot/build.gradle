plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.10'
    id 'io.spring.dependency-management' version '1.1.6'
}

bootJar.enabled = true
jar.enabled = true

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation project(':module-domain')
    implementation project(':module-infra')
    implementation project(':module-discord')
    implementation project(':module-presentation')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

bootJar {
    archiveFileName  = 'lostart.discord.bot-0.0.1-SNAPSHOT.jar'
    destinationDirectory = file("$rootDir/build/libs")
}